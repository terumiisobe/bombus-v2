spring:
  application:
    name: bombus
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bombus}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

twilio:
  auth-token: ${TWILIO_AUTH_TOKEN}
  public-base-url: ${TWILIO_PUBLIC_BASE_URL}

colmeia:
  # Status excluded by default from a plain/species count (resolved to an id at runtime).
  default-excluded-status: ${COLMEIA_DEFAULT_EXCLUDED_STATUS:perdida}

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
