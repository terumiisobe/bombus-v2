spring:
  application:
    name: bombus
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bombus}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

twilio:
  auth-token: ${TWILIO_AUTH_TOKEN}
  public-base-url: ${TWILIO_PUBLIC_BASE_URL}

colmeia:
  # Statuses excluded by default from a plain/species count and default list (resolved at runtime).
  # The same set releases hive codes for reuse when a hive enters one of these statuses.
  default-excluded-statuses:
    - perdida
    - vendida

chatbot:
  session:
    # Sliding session window: refreshed on every message. Expired sessions read as fresh.
    ttl: ${CHATBOT_SESSION_TTL:15m}
    max-context-messages: ${CHATBOT_SESSION_MAX_CONTEXT_MESSAGES:5}
  agent:
    # Max model complete() rounds per WhatsApp turn (tool calls + final reply).
    max-tool-rounds: ${CHATBOT_AGENT_MAX_TOOL_ROUNDS:3}

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  timeout: ${OPENAI_TIMEOUT:10s}

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
